<!DOCTYPE html>
<html lang="{{.HTMLLang}}" dir="{{.Dir}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{index .T "login"}} — {{index .T "app_name"}}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container" style="max-width:420px;margin-top:48px">
    <div class="nav">
      <span class="brand">{{index .T "app_name"}}</span>
      <div>
        <a href="/lang?lang=fa">FA</a>
        <a href="/lang?lang=en">EN</a>
        <a href="/about">{{index .T "about"}}</a>
      </div>
    </div>
    {{if .Error}}<div class="alert alert-danger">{{.Error}}</div>{{end}}
    <form method="post">
      <label>{{index .T "password"}}</label>
      <input type="password" name="password" required autofocus>
      <button type="submit" class="btn-success">{{index .T "submit_login"}}</button>
    </form>
    <p style="text-align:center;margin-top:18px;font-size:12px;color:#94a3b8">
      {{index .T "light_version"}} · <a href="/about">{{index .T "about_author"}}</a>
    </p>
  </div>
</body>
</html>

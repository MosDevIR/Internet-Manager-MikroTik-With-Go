name: Build multi-arch binaries & MikroTik images

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # برای ساخت Release روی تگ

jobs:
  # ------------------------------------------------------------
  # 1. ساخت باینری‌های معمولی (همه پلتفرم‌ها)
  # ------------------------------------------------------------
  binaries:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            goarm: ""
            name: amd64
          - goos: linux
            goarch: arm64
            goarm: ""
            name: arm64
          - goos: linux
            goarch: arm
            goarm: "7"
            name: armv7
          - goos: windows
            goarch: amd64
            goarm: ""
            name: windows-amd64
          - goos: darwin
            goarch: arm64
            goarm: ""
            name: darwin-arm64
          - goos: darwin
            goarch: amd64
            goarm: ""
            name: darwin-amd64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          OUT="internet-manager-${{ matrix.name }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            OUT="${OUT}.exe"
          fi
          go build -trimpath -ldflags="-s -w" -o "$OUT"
          echo "OUT=$OUT" >> $GITHUB_ENV
          ls -lh "$OUT"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.name }}
          path: |
            internet-manager-${{ matrix.name }}
            internet-manager-${{ matrix.name }}.exe
          if-no-files-found: ignore

  # ------------------------------------------------------------
  # 2. ساخت ایمیج‌های Docker مخصوص میکروتیک (armv7 / arm64 / amd64)
  # ------------------------------------------------------------
  mikrotik-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/arm64
            name: arm64
          - platform: linux/arm/v7
            name: armv7
          - platform: linux/amd64
            name: amd64

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and save MikroTik image
        run: |
          docker buildx build \
            --platform ${{ matrix.platform }} \
            -t internet-manager:${{ matrix.name }} \
            --load \
            .

          docker save internet-manager:${{ matrix.name }} \
            -o internet-manager-${{ matrix.name }}.tar

          ls -lh internet-manager-${{ matrix.name }}.tar

      - name: Upload MikroTik image
        uses: actions/upload-artifact@v4
        with:
          name: mikrotik-${{ matrix.name }}
          path: internet-manager-${{ matrix.name }}.tar

  # ------------------------------------------------------------
  # 3. ساخت Release روی تگ (اختیاری ولی خیلی مفید)
  # ------------------------------------------------------------
  release:
    needs: [binaries, mikrotik-images]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          # باینری‌ها
          find artifacts -name "internet-manager-*" -type f -exec cp {} release/ \;
          # ایمیج‌های میکروتیک
          find artifacts -name "internet-manager-*.tar" -type f -exec cp {} release/ \;
          ls -lh release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: false

name: Build MikroTik arm64 image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build linux/arm64 binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -trimpath -ldflags="-s -w" -o internet-manager

      - name: Package tar
        run: |
          mkdir -p rootfs
          cp internet-manager rootfs/internet-manager
          chmod +x rootfs/internet-manager
          tar -C rootfs -cvf internet-manager-arm64.tar internet-manager

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: internet-manager-arm64
          path: |
            internet-manager
            internet-manager-arm64.tar

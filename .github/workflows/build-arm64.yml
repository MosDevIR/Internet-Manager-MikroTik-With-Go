name: Build MikroTik Docker image (arm64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and save arm64 image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -t internet-manager:arm64 \
            --load \
            .

          docker save internet-manager:arm64 -o internet-manager-arm64.tar
          ls -lh internet-manager-arm64.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: internet-manager-arm64-docker
          path: internet-manager-arm64.tar
